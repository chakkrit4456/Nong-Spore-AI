<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เข้าสู่ระบบ · Nong Spore AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f7d4f' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M3 12a9 7 0 0 1 18 0z'/%3E%3Cpath d='M9 12v6a3 3 0 0 0 6 0v-6'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#1d2a1f;--mute:#66715f;--line:#e3e8dd;--acc:#2f7d4f;--bad:#c63b3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111611;--card:#1a211b;--ink:#e6ede4;--mute:#97a393;--line:#2b352c;--acc:#5fc287}}
:root[data-theme="dark"]{--bg:#111611;--card:#1a211b;--ink:#e6ede4;--mute:#97a393;--line:#2b352c;--acc:#5fc287}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px}
.logo{width:52px;height:52px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;margin:0 auto 12px}
.logo svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{text-align:center;font-size:20px;margin:0}p.sub{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 22px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 6px}
input{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
button{width:100%;margin-top:20px;font:inherit;font-weight:600;background:var(--acc);color:#fff;border:0;border-radius:9px;padding:11px;cursor:pointer}
button:disabled{opacity:.6}
#err{color:var(--bad);font-size:14px;min-height:20px;margin-top:12px;text-align:center}
</style>
</head>
<body>
<form id="f">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M3 12a9 7 0 0 1 18 0z"/><path d="M9 12v6a3 3 0 0 0 6 0v-6"/></svg></div>
  <h1>Nong Spore AI</h1>
  <p class="sub">ระบบติดตามโรงเรือนเพาะเห็ด</p>
  <label for="u">ชื่อผู้ใช้</label><input id="u" autocomplete="username" required autofocus>
  <label for="p">รหัสผ่าน</label><input id="p" type="password" autocomplete="current-password" required>
  <button id="b">เข้าสู่ระบบ</button>
  <div id="err" role="alert"></div>
</form>
<script>
try{const t=localStorage.getItem("ns_theme");if(t)document.documentElement.dataset.theme=t}catch{}
document.getElementById("f").onsubmit=async e=>{
  e.preventDefault();const b=document.getElementById("b"),err=document.getElementById("err");b.disabled=true;err.textContent="";
  try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username:document.getElementById("u").value.trim(),password:document.getElementById("p").value})});
    const j=await r.json().catch(()=>({}));if(r.ok){location.href="/";return}err.textContent=j.error||"เข้าสู่ระบบไม่สำเร็จ"}
  catch{err.textContent="เชื่อมต่อเซิร์ฟเวอร์ไม่ได้"}
  b.disabled=false};
</script>
</body>
</html>
